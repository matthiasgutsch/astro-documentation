<div class="demo-layout">
  <div class="preview">
    <p-select
      [(ngModel)]="selectedOption"
      [options]="options"
      optionLabel="label"
      optionValue="value"
      placeholder="Select an option"
      [variant]="variant"
      [size]="size"
      [disabled]="disabled"
      [showClear]="showClear"
      [fluid]="fluid"
      [invalid]="invalid"
      [loading]="loading"
      [filter]="filter"
    />
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Variant</span>
      <div class="chips">
        @for (v of variants; track v.label) {
          <button class="chip" [class.active]="variant === v.value" (click)="variant = v.value">
            {{ v.label }}
          </button>
        }
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Size</span>
      <div class="chips">
        @for (s of sizes; track s.label) {
          <button class="chip" [class.active]="size === s.value" (click)="size = s.value">
            {{ s.label }}
          </button>
        }
      </div>
    </div>

    <div class="toggles">
      <button class="toggle" [class.active]="disabled" (click)="disabled = !disabled">
        Disabled
      </button>
      <button class="toggle" [class.active]="showClear" (click)="showClear = !showClear">
        Show Clear
      </button>
      <button class="toggle" [class.active]="fluid" (click)="fluid = !fluid">Fluid</button>
      <button class="toggle" [class.active]="invalid" (click)="invalid = !invalid">Invalid</button>
      <button class="toggle" [class.active]="loading" (click)="loading = !loading">Loading</button>
      <button class="toggle" [class.active]="filter" (click)="filter = !filter">Filter</button>
    </div>
  </div>
</div>
