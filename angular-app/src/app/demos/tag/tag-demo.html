<div class="demo-layout">

  <div class="preview">
    <p-tag
      value="Label"
      [severity]="severity"
      [rounded]="rounded"
      [icon]="withIcon ? 'pi pi-check' : ''"
    />
  </div>

  <div class="controls">

    <div class="ctrl-group">
      <span class="ctrl-label">Severity</span>
      <div class="chips">
        @for (s of severities; track s.label) {
          <button class="chip" [class.active]="severity === s.value" (click)="severity = s.value">
            {{ s.label }}
          </button>
        }
      </div>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">Size</span>
      <div class="chips">
        @for (s of sizes; track s.label) {
          <button class="chip" [class.active]="size === s.value" (click)="size = s.value">
            {{ s.label }}
          </button>
        }
      </div>
    </div>

    <div class="toggles">
      <button class="toggle" [class.active]="rounded"  (click)="rounded  = !rounded">Rounded</button>
      <button class="toggle" [class.active]="withIcon" (click)="withIcon = !withIcon">Icon</button>
    </div>

  </div>
</div>
